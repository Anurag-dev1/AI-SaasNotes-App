version: '3.8'
services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis-cache:
    image: redis:7
    ports:
      - "6379:6379"

  redis-durable:
    image: redis:7
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_durable_data:/data

volumes:
  mongo_data:
  redis_durable_data:
